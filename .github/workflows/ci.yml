name: CI

on:
  push:
    branches: [main, feat/*, ticket/*]
  pull_request:
    branches: [main, feat/*]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitness_coach
          POSTGRES_PASSWORD: fitness_coach
          POSTGRES_DB: fitness_coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fitness_coach -d fitness_coach_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Alembic migrations & pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://fitness_coach:fitness_coach@localhost:5432/fitness_coach_test
        run: |
          alembic upgrade head
          pytest -v

  frontend-and-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend (for OpenAPI export)
        working-directory: backend
        run: pip install -e .

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check OpenAPI contract drift
        run: |
          python backend/scripts/export_openapi.py --output /tmp/openapi.json
          cd frontend
          npx openapi-typescript /tmp/openapi.json -o /tmp/schema.d.ts
          diff -u src/api/generated/schema.d.ts /tmp/schema.d.ts

      - name: Typecheck, test, and build PWA
        working-directory: frontend
        run: |
          npm run typecheck
          npm test -- --run
          npm run build
