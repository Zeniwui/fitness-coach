services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fitness-coach-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitness_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness_coach}
      POSTGRES_DB: ${POSTGRES_DB:-fitness_coach}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitness_coach} -d ${POSTGRES_DB:-fitness_coach}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
